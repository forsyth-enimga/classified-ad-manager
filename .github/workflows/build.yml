name: Build installers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Set up platform folders (minSdk 26 = Android 8)
        run: bash tool/setup_platforms.sh
      - name: Core logic checks
        run: dart run tool/self_check.dart
      - name: Static analysis (reported, does not block the build)
        run: flutter analyze
        continue-on-error: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsqlite3-dev liblzma-dev
      - run: bash tool/setup_platforms.sh
      - run: flutter build linux --release
      - run: bash packaging/linux/build_deb.sh 1.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: build/deb/*.deb

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/setup_platforms.sh
        shell: bash
      - run: flutter build windows --release
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build\windows -Recurse -Filter classified_ad_manager.exe | Select-Object -First 1
          if (-not $exe) {
            Get-ChildItem -Path build\windows -Recurse -Depth 4 | Select-Object -First 80 -ExpandProperty FullName
            throw "classified_ad_manager.exe not found under build\windows"
          }
          Write-Host "Packaging $($exe.DirectoryName)"
          New-Item -ItemType Directory -Force -Path build\installer | Out-Null
          $out = (Resolve-Path build\installer).Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DBuildDir=$($exe.DirectoryName)" "/O$out" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/installer/*.exe
