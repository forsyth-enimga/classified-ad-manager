name: Build installers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Set up platform folders (minSdk 26 = Android 8)
        run: bash tool/setup_platforms.sh
      - name: Core logic checks
        run: dart run tool/self_check.dart
      - run: flutter analyze
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsqlite3-dev liblzma-dev
      - run: bash tool/setup_platforms.sh
      - run: flutter build linux --release
      - run: bash packaging/linux/build_deb.sh 1.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: build/deb/*.deb

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: bash tool/setup_platforms.sh
        shell: bash
      - run: flutter build windows --release
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/installer/*.exe
